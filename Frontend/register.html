<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Hospital Inventory
    </title>

    <link
        rel="stylesheet"
        href="Styles/register.css"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Inventory Management
            </h1>

            <p>
                Create Staff Account
            </p>


            <form id="registerForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter full name"
                    required
                >


                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose username"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Choose password"
                    required
                >


                <button
                    type="submit"
                >
                    Register
                </button>


                <p id="registerMessage"></p>


                <p>
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>


    <script src="Js/register.js"></script>

</body>

</html>
